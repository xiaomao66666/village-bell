name: Build and test Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test parser against synthetic fixtures
        run: ./test-parser.ps1
      - name: Download and verify Android SDK tools
        run: ./setup-tools.ps1
      - name: Build and verify development APK
        run: ./build-apk.ps1
      - name: Upload development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: village-bell-development
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
